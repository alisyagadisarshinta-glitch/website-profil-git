<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Siswa RPL • Glow Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Efek cahaya lembut penuh layar -->
  <div class="aura-cahaya aura-1" aria-hidden="true"></div>
  <div class="aura-cahaya aura-2" aria-hidden="true"></div>
  <div class="aura-cahaya aura-3" aria-hidden="true"></div>

  <!-- Gerombolan emoji bundar memenuhi seluruh layar -->
  <div class="kanvas-emoji" aria-hidden="true">
    <div class="cluster c1">
      <span>😝</span><span>😜</span><span>😛</span>
    </div>
    <div class="cluster c2">
      <span>😈</span><span>🦄</span><span>💜</span>
    </div>
    <div class="cluster c3">
      <span>🫀</span><span>❤️</span><span>❤️‍🔥</span>
    </div>
    <div class="cluster c4">
      <span>🐭</span><span>🐨</span><span>🐼</span>
    </div>
    <div class="cluster c5">
      <span>🦭</span><span>🌈</span><span>💖</span>
    </div>
    <div class="cluster c6">
      <span>💐</span><span>🌷</span><span>🪻</span>
    </div>
    <div class="cluster c7">
      <span>🩷</span><span>💞</span><span>💝</span>
    </div>
    <div class="cluster c8">
      <span>💘</span><span>💖</span><span>🤍</span>
    </div>
    <div class="cluster c9">
      <span>🦄</span><span>💐</span><span>🩷</span>
    </div>
    <div class="cluster c10">
      <span>🐼</span><span>🌷</span><span>💜</span>
    </div>
    <div class="cluster c11">
      <span>🐨</span><span>🪻</span><span>💞</span>
    </div>
    <div class="cluster c12">
      <span>🦭</span><span>💝</span><span>💘</span>
    </div>
    <div class="cluster c13">
      <span>😝</span><span>🌈</span><span>💖</span>
    </div>
    <div class="cluster c14">
      <span>😈</span><span>❤️</span><span>🤍</span>
    </div>
  </div>

  <main class="kartu">
    <div class="badge-elegan">✨ XI RPL • SWEET &amp; GLOW ✨</div>
    <div class="avatar">🦄</div>
    <h1>Alisya Gadis Arshinta</h1>
    <p class="peran">Peserta Didik Rekayasa Perangkat Lunak</p>
    <p class="deskripsi">
      Belajar merapikan kode, mengelola riwayat versi dengan Git, dan mengunggah proyek ke GitHub dengan sentuhan visual yang ceria dan elegan. 🪻💖
    </p>
    <button id="tombolSalam" type="button">Klik buat sapaan manis 💘</button>
    <p id="pesan" class="pesan-lucu"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>

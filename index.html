<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="stylesheet" href="style.css">

  <div class="cahaya-glow cahaya-3" aria-hidden="true"></div>

  <!-- Elemen emoji rame di latar belakang -->
  <div class="floating-layer" aria-hidden="true">
    <span class="emot-item e1">😝</span>
    <span class="emot-item e2">😈</span>
    <span class="emot-item e3">🫀</span>
    <span class="emot-item e4">🐭</span>
    <span class="emot-item e5">🐨</span>
    <span class="emot-item e6">🐼</span>
    <span class="emot-item e7">🦄</span>
    <span class="emot-item e8">🦭</span>
    <span class="emot-item e9">💐</span>
    <span class="emot-item e10">🌷</span>
    <span class="emot-item e11">🪻</span>
    <span class="emot-item e12">🌈</span>
    <span class="emot-item e13">❤️</span>
    <span class="emot-item e14">🩷</span>

    <span class="emot-item e16">❤️‍🔥</span>

    <span class="emot-item e19">💘</span>
    <span class="emot-item e20">💖</span>
    <span class="emot-item e21">🤍</span>

  <main class="kartu">
    <div class="badge-elegan">✨ XI RPL • SWEET &amp; GLOW ✨</div>
    <div class="avatar">🦄</div>
    <h1>Alisya Gadis Arshinta</h1>
    <p class="peran">Peserta Didik Rekayasa Perangkat Lunak</p>
    <p class="deskripsi">
      Belajar merapikan kode, mengelola riwayat versi dengan Git, dan mengunggah proyek ke GitHub dengan sentuhan visual yang ceria dan elegan. 🪻💖
    </p>
    <button id="tombolSalam" type="button">Klik buat sapaan manis 💘</button>
    <p id="pesan" class="pesan-lucu"></p>
  </main>

  <script src="script.js"></script>

</html>
